name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and type-check
        run: npm run build

      - name: Docker build
        run: docker build -t hello-turist-backend:ci .

      - name: Verify Docker image metadata
        run: docker image inspect hello-turist-backend:ci --format "{{.Config.ExposedPorts}}"
